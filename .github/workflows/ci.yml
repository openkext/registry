# SPDX-License-Identifier: MIT
name: checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Check every entry and report, build catalog.json
        run: python tools/check_registry.py build/catalog.json
      - uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: build/catalog.json
