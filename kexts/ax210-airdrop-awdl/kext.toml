id = "ax210-airdrop-awdl"
name = "AirportItlwm with AWDL and AirDrop"
summary = "Fork of OpenIntelWireless AirportItlwm that adds AWDL and AirDrop for the Intel AX210 on Sequoia and Tahoe, with a BlueToolFixup build for BLE advertising sets."
kind = "kext"
categories = ["wifi", "bluetooth"]
source = "https://github.com/kevineduardo/ax210-airdrop-awdl-hackintosh"
license = "GPL-2.0-only"
license_file = "driver/AirportItlwm/LICENSE"
maintainers = ["kevineduardo"]
ai_disclosure = "Developed with Claude (Opus 5.5, Fable 5.2); every change tested on hardware by the maintainer."
bundle_ids = ["com.zxystd.AirportItlwm", "as.acidanthera.BlueToolFixup"]
based_on = [
  "https://github.com/OpenIntelWireless/itlwm",
  "https://github.com/laobamac/itlwm",
  "https://github.com/crazyhulk/itlwm",
  "https://github.com/acidanthera/BrcmPatchRAM",
]

